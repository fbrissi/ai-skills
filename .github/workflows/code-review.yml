name: Code Review

# Dispatched by Quality Checks on the default branch, so a pull request cannot change its own reviewer.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

jobs:
  code-review:
    name: Code Review
    uses: fbrissi/github-actions/.github/workflows/code-review.yml@v1
    permissions:
      checks: write
      contents: read
      pull-requests: read
    with:
      pr-number: ${{ inputs.pr_number }}
      opencode-command: ""
      opencode-plugins: ""
      review-skill-source: base
      node-version: "24"
      node-cache: npm
      install-command: npm ci
    secrets: inherit
