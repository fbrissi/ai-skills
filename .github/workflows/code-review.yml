name: Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: code-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  register:
    name: Register Code Review
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      checks: write
      pull-requests: read
    outputs:
      check_run_id: ${{ steps.register.outputs.check_run_id }}
      pr_number: ${{ steps.register.outputs.pr_number }}
      head_sha: ${{ steps.register.outputs.head_sha }}
      head_repository: ${{ steps.register.outputs.head_repository }}
    steps:
      - uses: actions/github-script@v9
        id: register
        with:
          script: |
            const prNumber = Number(context.payload.inputs.pr_number);
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = pullRequest.head.sha;
            const headRepository = pullRequest.head.repo.full_name;
            if (pullRequest.draft) {
              core.setFailed(`PR #${prNumber} is still a draft.`);
              return;
            }
            core.setOutput('pr_number', pullRequest.number);
            core.setOutput('head_sha', headSha);
            core.setOutput('head_repository', headRepository);

            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: 'Code Review',
            });

            const existing = checks.data.check_runs
              .filter((check) => check.name === 'Code Review')
              .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];

            if (existing && ['queued', 'in_progress'].includes(existing.status)) {
              core.setOutput('check_run_id', existing.id);
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: existing.id,
                status: 'queued',
                output: {
                  title: 'Code Review queued',
                  summary: 'Quality Checks completed successfully; Code Review is starting.',
                },
              });
              return;
            }

            const created = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Code Review',
              head_sha: headSha,
              status: 'queued',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('check_run_id', created.data.id);

  start-review:
    name: Start Code Review
    needs: register
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      checks: write
      pull-requests: read
    outputs:
      check_run_id: ${{ steps.start.outputs.check_run_id }}
      pr_number: ${{ steps.start.outputs.pr_number }}
      head_sha: ${{ steps.start.outputs.head_sha }}
      head_repository: ${{ steps.start.outputs.head_repository }}
      base_ref: ${{ steps.start.outputs.base_ref }}
      base_sha: ${{ steps.start.outputs.base_sha }}
      head_ref: ${{ steps.start.outputs.head_ref }}
    steps:
      - uses: actions/github-script@v9
        id: start
        with:
          script: |
            const prNumber = Number(context.payload.inputs.pr_number);
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = pullRequest.head.sha;
            core.setOutput('pr_number', pullRequest.number);
            core.setOutput('head_sha', headSha);
            core.setOutput('head_repository', pullRequest.head.repo.full_name);
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('base_sha', pullRequest.base.sha);
            core.setOutput('head_ref', pullRequest.head.ref);

            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: 'Code Review',
            });
            const check = checks.data.check_runs
              .filter((item) => item.name === 'Code Review')
              .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];

            if (!check) {
              core.setFailed(`Code Review check was not found for PR #${pullRequest.number}.`);
              return;
            }

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: check.id,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_run_id', check.id);

  review:
    name: Run Code Review
    needs: start-review
    if: ${{ needs.start-review.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 30
    environment:
      name: code-review
    steps:
      - name: Resolve AI harness
        id: harness
        env:
          AI_HARNESS: ${{ vars.AI_HARNESS }}
        run: |
          set -euo pipefail
          harness="${AI_HARNESS:-opencode}"
          case "$harness" in
            opencode | claude) ;;
            *)
              echo "::error::Unsupported AI_HARNESS '${harness}'. Use opencode or claude."
              exit 1
              ;;
          esac
          echo "Code Review harness: $harness"
          echo "name=$harness" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.start-review.outputs.head_repository }}
          ref: ${{ needs.start-review.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch pull request base
        env:
          BASE_REF: ${{ needs.start-review.outputs.base_ref }}
          BASE_SHA: ${{ needs.start-review.outputs.base_sha }}
          HEAD_REF: ${{ needs.start-review.outputs.head_ref }}
          HEAD_SHA: ${{ needs.start-review.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
            git fetch --no-tags --unshallow origin
          fi

          git remote add review-base "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --force review-base \
            "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git update-ref "refs/remotes/origin/${BASE_REF}" "$BASE_SHA"
          git update-ref "refs/remotes/origin/${HEAD_REF}" "$HEAD_SHA"
          merge_base="$(git merge-base "refs/remotes/origin/${BASE_REF}" "refs/remotes/origin/${HEAD_REF}" || true)"
          if [ -z "$merge_base" ]; then
            echo "No merge base between ${BASE_REF} (${BASE_SHA}) and ${HEAD_REF} (${HEAD_SHA})." >&2
            exit 1
          fi
          echo "Review merge base: $merge_base"
          git update-ref "refs/heads/${BASE_REF}" "$BASE_SHA"
          git update-ref "refs/heads/${HEAD_REF}" "$HEAD_SHA"
          git remote remove review-base
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenCode
        if: ${{ steps.harness.outputs.name == 'opencode' }}
        env:
          OPENCODE_VERSION: 1.19.5
          OPENCODE_SHA256: 588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          curl -fsSL --retry 3 --output "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/opencode" "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode"
          install -m 0755 "$RUNNER_TEMP/opencode/opencode" "$HOME/.opencode/bin/opencode"
          rm -rf "$archive" "$RUNNER_TEMP/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code
        if: ${{ steps.harness.outputs.name == 'claude' }}
        env:
          CLAUDE_CODE_VERSION: 2.1.319
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Install review-changes skill from the base branch
        env:
          BASE_SHA: ${{ needs.start-review.outputs.base_sha }}
          HARNESS: ${{ steps.harness.outputs.name }}
        run: |
          set -euo pipefail
          # Use the base branch's skill so a pull request cannot rewrite its own reviewer.
          skill_path='.rulesync/skills/review-changes'
          source_ref="$BASE_SHA"
          if ! git cat-file -e "${BASE_SHA}:${skill_path}/SKILL.md" 2>/dev/null; then
            echo "::warning::review-changes is not on the base branch yet; using the pull request's version."
            source_ref='HEAD'
          fi
          case "$HARNESS" in
            opencode) skills_dir="$HOME/.config/opencode/skills" ;;
            claude) skills_dir="$HOME/.claude/skills" ;;
          esac
          mkdir -p "$skills_dir"
          git archive "$source_ref" "$skill_path" | tar -x -C "$RUNNER_TEMP"
          rm -rf "$skills_dir/review-changes"
          cp -R "$RUNNER_TEMP/$skill_path" "$skills_dir/review-changes"

      - name: Run AI review
        env:
          HARNESS: ${{ steps.harness.outputs.name }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_VARIANT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.start-review.outputs.pr_number }}
          HEAD_SHA: ${{ needs.start-review.outputs.head_sha }}
        run: |
          set -euo pipefail

          # Empty credentials must not shadow another authentication method.
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done

          prompt="Use the review-changes skill to review pull request #${PR_NUMBER} in ${GITHUB_REPOSITORY} and publish the review on GitHub. Do not modify, commit, or push any files."
          output_file="$RUNNER_TEMP/code-review-output.txt"
          review_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          case "$HARNESS" in
            opencode)
              if [ -z "${OPENCODE_MODEL:-}" ]; then
                echo '::error::The opencode harness requires the OPENCODE_MODEL variable.'
                exit 1
              fi
              command=(opencode run "--model=${OPENCODE_MODEL}" --thinking --dangerously-skip-permissions)
              if [ -n "${OPENCODE_VARIANT:-}" ]; then
                command+=("--variant=${OPENCODE_VARIANT}")
              fi
              timeout --foreground --kill-after=30s 25m "${command[@]}" "$prompt" 2>&1 | tee "$output_file"
              ;;
            claude)
              if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
                echo '::error::The claude harness requires the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret.'
                exit 1
              fi
              command=(claude --print --output-format text --dangerously-skip-permissions)
              if [ -n "${CLAUDE_MODEL:-}" ]; then
                command+=(--model "$CLAUDE_MODEL")
              fi
              if [ -n "${CLAUDE_EFFORT:-}" ]; then
                command+=(--effort "$CLAUDE_EFFORT")
              fi
              printf '%s' "$prompt" \
                | timeout --foreground --kill-after=30s 25m "${command[@]}" 2>&1 \
                | tee "$output_file"
              ;;
          esac

          if grep -qE '^Published: skipped' "$output_file"; then
            echo 'The review was skipped on purpose (already approved or no new findings).'
            exit 0
          fi

          review_count=0
          for attempt in 1 2 3 4 5 6; do
            echo "Waiting for the published review (attempt ${attempt}/6)"
            reviews_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            review_count="$(printf '%s' "$reviews_json" | jq --arg head "$HEAD_SHA" --arg started "$review_started_at" '[.[] | select(.commit_id == $head and .submitted_at != null and .submitted_at >= $started)] | length')"
            if [ "$review_count" -gt 0 ]; then
              break
            fi
            sleep 5
          done

          if [ "$review_count" -eq 0 ]; then
            echo "The ${HARNESS} harness did not publish a GitHub review for the current commit." >&2
            exit 1
          fi

      - name: Export OpenCode session
        if: ${{ always() && !cancelled() && steps.harness.outputs.name == 'opencode' }}
        run: |
          session_id="$(opencode session list | awk 'NR > 2 && $1 ~ /^ses_/ { print $1; exit }')"

          if [ -n "$session_id" ]; then
            echo "OpenCode session: $session_id"
            opencode export "$session_id"
          else
            echo "No OpenCode session found to export"
          fi

  finish-review:
    name: Finish Code Review
    needs: [start-review, review]
    if: ${{ always() && !cancelled() && needs.start-review.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      checks: write
    steps:
      - uses: actions/github-script@v9
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          CHECK_RUN_ID: ${{ needs.start-review.outputs.check_run_id }}
        with:
          script: |
            const conclusion = process.env.REVIEW_RESULT === 'success' ? 'success' : 'failure';

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: process.env.CHECK_RUN_ID,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: conclusion === 'success' ? 'Code Review completed' : 'Code Review failed',
                summary: conclusion === 'success'
                  ? 'The AI harness completed the pull request review.'
                  : 'The AI harness failed before completing the pull request review.',
              },
            });
