name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_notes:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v1.0.0 or 1.0.0.
        required: true
        type: string
      prerelease:
        description: Mark as prerelease.
        required: false
        type: boolean
        default: false
      release_notes:
        description: Optional release notes. Leave empty to use the CHANGELOG.md section.
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize and validate version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Semantic Versioning release version: $INPUT_VERSION"
            exit 1
          fi

          version="v$version"
          ref_sha=$(git rev-parse HEAD)
          if tag_sha=$(git rev-parse -q --verify "refs/tags/$version^{}"); then
            if [ "$tag_sha" != "$ref_sha" ]; then
              echo "Release tag $version already points to a different commit."
              exit 1
            fi

            echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Create Release
    needs: validate
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release notes
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          notes="$INPUT_RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes=$(awk -v heading="## $VERSION" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "Release $VERSION must include release notes."
            exit 1
          fi

          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
      - name: Create and push tag
        if: ${{ needs.validate.outputs.tag_exists != 'true' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            exit 0
          fi

          args=("$VERSION" --title "Release $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
