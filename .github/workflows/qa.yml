name: QA

# Dispatched by Quality Checks on the default branch next to Code Review, so a pull request cannot change its own QA.
# QA runs apart from the developer and the reviewer (fbrissi/github-actions README, Review and QA in separate jobs):
# its verdict is the AI QA check run, joined with the code review of the same head commit.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: true
        type: string
      instructions:
        description: Extra instructions for this run only, appended to the agent prompt.
        required: false
        type: string

permissions: {}

jobs:
  qa:
    name: QA
    if: github.ref == 'refs/heads/main'
    uses: fbrissi/github-actions/.github/workflows/qa.yml@v1
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: write
    with:
      pr-number: ${{ inputs.pr_number }}
      instructions: ${{ inputs.instructions }}
      # The environment of the Code Review job (the default of the shared Code Review workflow).
      environment: code-review
      ai-skills-ref: v0.15.0
      node-version: "24"
      node-cache: npm
      install-command: npm ci
      # No setup-command: there is no app to start, so QA uses targeted validation (the scripts and their tests).
    secrets: inherit
