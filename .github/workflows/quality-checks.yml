name: Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Quality / ${{ matrix.name }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: generated-outputs
            command: npm run check
          - name: rulesync-doctor
            command: npm run doctor
          - name: shell-syntax
            command: for f in scripts/*.sh shared/scripts/*.sh .rulesync/skills/*/scripts/*.sh; do bash -n "$f"; done; for f in .rulesync/skills/*/scripts/*.rb; do ruby -c "$f"; done
          - name: skills-discovery
            command: scripts/check-discovery.sh
          - name: dependency-audit
            command: npm audit --audit-level=high
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.name }}
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: ${{ matrix.command }}

  release-note:
    name: Quality / release-note
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    uses: fbrissi/github-actions/.github/workflows/release-note.yml@v1
    permissions:
      contents: read
    with:
      check-package-version: true

  quality-jobs:
    name: Quality Checks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [quality, release-note]
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate quality results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_NOTE_RESULT: ${{ needs.release-note.result }}
        run: |
          set -euo pipefail

          if [ "$QUALITY_RESULT" != 'success' ]; then
            echo "Quality result: $QUALITY_RESULT"
            exit 1
          fi

          if [ "$RELEASE_NOTE_RESULT" != 'success' ] && [ "$RELEASE_NOTE_RESULT" != 'skipped' ]; then
            echo "Release note result: $RELEASE_NOTE_RESULT"
            exit 1
          fi

      - name: Dispatch Code Review
        if: ${{ success() && github.event_name == 'pull_request' && vars.CODE_REVIEW_ENABLED != 'false' }}
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'code-review.yml',
              // The default branch runs the caller, so a pull request cannot change its own reviewer.
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(pullRequest.number),
              },
            });
